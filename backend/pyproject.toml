[project]
name = "cinematch-backend"
version = "0.1.0"
description = "CineMatch backend API - Swipe-based movie picker"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.12",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy==2.0.40",
    "pydantic==2.11.1",
    "python-multipart>=0.0.31",   # CVE-2026-42561/53539/53540/53538 fixes
    "psycopg[binary]==3.2.6",
    "alembic>=1.15.2",
    "httpx>=0.27.2",
    "structlog>=25.5.0",
    "starlette>=1.3.1",           # PYSEC-2026-248/249 fixes (transitive via fastapi)
    "mako>=1.3.12",               # CVE-2026-44307 fix (transitive via alembic)
    "idna>=3.15",                 # PYSEC-2026-215 fix (transitive)
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "httpx<0.28",
    "ruff>=0.1.0",
    "ty>=0.0.20",
    "testcontainers[postgres]>=4.0.0",
    "pip-audit>=2.10.0",
    "pip-outdated>=0.8.0",
    "pytest-playwright>=0.7.2",
    "aiohttp>=3.14.1",            # CVE-2026-47265/54276 + PYSEC-2026-237 fixes
    "pygments==2.20.0",
    "requests==2.33.0",
    "urllib3>=2.7.0",            # PYSEC-2026-141/142 fixes (transitive)
    "msgpack>=1.2.1",           # GHSA-6v7p-g79w-8964 fix (transitive)
    "pip>=26.1.2",              # PYSEC-2026-196 + CVE-2026-3219/6357 fixes
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Include the app package
where = ["."]
include = ["app*", "tests*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.environment]
# ty is Astral's Rust-based type checker
# Fast feedback: 10-100x faster than mypy
python-version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
